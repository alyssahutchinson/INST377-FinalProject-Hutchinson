        <body>
            <h2>Get meal ideas by searching with a main ingredient:</h2>
            <form onsubmit="return findMeal(event)">
                <input id="inputPhrase" type="text" required >
                <button type="submit"> Search</button>
            </form>
            <div id="mainResults"></div>

            <h2>Get meal ideas by searching by category</h2>
            <p><i>Options: Seafood, Beef, Chicken, Dessert, Vegetarian</i></p>
            <form onsubmit="return categoryMeal(event)">
                <input id="catInput" type="text" required >
                <button type="submit"> Search</button>
            </form>

            <div id="catResults"></div>
